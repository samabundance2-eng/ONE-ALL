<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1220;--ice:169,216,255;--ink:#EEF3FA;--dim:#A9B6C8;--warm:255,206,150;--lx:31%;--err:#FFB4A8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--navy);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;min-height:100vh;display:grid;grid-template-columns:1fr minmax(380px,38%);align-items:center;overflow:hidden}
.bg{position:absolute;inset:0;pointer-events:none}.bg>*{position:absolute;inset:0}
.room{background:radial-gradient(ellipse 45% 55% at 92% 0%,rgba(var(--ice),.09),transparent 70%),linear-gradient(180deg,#0d1627,#0A111E 79%,#060a12 79%,#0b1322)}
.slats{inset:0 auto 21% 0;width:48%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 46px,rgba(0,0,0,.3) 46px 48px);-webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent)}
.floor{top:79%;border-top:1px solid rgba(var(--ice),.09);background:linear-gradient(rgba(var(--ice),.05),transparent 70%)}
.wash{background:radial-gradient(ellipse 52% 66% at var(--lx) 34%,rgba(var(--warm),.2),rgba(var(--warm),.06) 48%,transparent 75%);opacity:0;transition:opacity 2.4s}
.shaft{inset:34% auto 21% calc(var(--lx) - 22%);width:44%;background:linear-gradient(rgba(var(--warm),.1),transparent);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);opacity:0;transition:opacity 2.4s}
.pool{top:79%;background:radial-gradient(ellipse 30% 10% at var(--lx) 5%,rgba(var(--warm),.3),transparent 72%);opacity:0;transition:opacity 2.4s}
.vig{background:radial-gradient(ellipse at 40% 40%,transparent 38%,rgba(3,6,12,.7));transition:opacity 2.4s}
body.on .wash,body.on .shaft,body.on .pool{opacity:1}body.on .vig{opacity:.5}
.mote{position:absolute;inset:auto;border-radius:50%;background:radial-gradient(rgba(255,236,208,.9),transparent 70%);opacity:.14;filter:blur(1px);animation:fl 24s ease-in-out infinite alternate;transition:opacity 2.4s}
body.on .mote{opacity:.5}
@keyframes fl{to{transform:translate(18px,-80px)}}
.lampw{position:absolute;left:var(--lx);top:0;transform:translateX(-50%);width:clamp(220px,45vh,400px);z-index:2;text-align:center;animation:drop 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes drop{from{opacity:0;transform:translate(-50%,-24px)}}
.lampw svg{width:100%;height:auto;display:block;overflow:visible}
#h{cursor:grab;touch-action:none}#h:active{cursor:grabbing}#h:focus-visible .hd{stroke:#fff;stroke-width:2}
.lit,.halo{opacity:0;transition:opacity 2.2s ease}body.on .lit{opacity:1}body.on .halo{opacity:.6}
.lampw canvas{width:100%;aspect-ratio:3/4;display:block}.hit{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:50%;cursor:grab;touch-action:none;z-index:3}.hit:active{cursor:grabbing}.hit:focus-visible{outline:2px solid rgb(var(--ice))}
.gl{overflow:hidden}.gi{position:absolute;opacity:var(--o);transition:opacity 2.4s;animation:gd 12s ease-in-out infinite alternate;will-change:transform}.gi svg{display:block}.ac{fill:rgba(217,184,115,.14)}body.on .gi{opacity:calc(var(--o)*1.35)}@keyframes gd{0%{transform:translate(0,0) rotate(var(--r0))}50%{transform:translate(var(--dx),var(--dy)) rotate(var(--r1))}100%{transform:translate(calc(var(--dx)*-.6),calc(var(--dy)*.5)) rotate(var(--r0))}}
.brand{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:clamp(18px,3vw,48px);z-index:6;width:46px;height:46px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))}
.hint{margin:0;display:flex;justify-content:center;align-items:center;gap:10px;color:var(--dim);font-size:13.5px}
.sw{font:500 12.5px Inter,sans-serif;color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.07);border:1px solid rgba(var(--ice),.25);transition:background .25s}
.sw:hover{background:rgba(255,255,255,.13)}.sw:focus-visible{outline:2px solid rgb(var(--ice));outline-offset:2px}
.side{position:relative;z-index:3;grid-column:2;display:flex;justify-content:center;padding:clamp(20px,3vw,48px)}
.glass{background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 50%,rgba(255,255,255,.07)),rgba(14,24,42,.58);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);border:1px solid rgba(var(--ice),.26);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 26px rgba(var(--ice),.04),0 24px 60px rgba(0,0,0,.45)}
@supports (backdrop-filter:url(#refract)){.glass{backdrop-filter:blur(16px) url(#refract) saturate(1.4)}}
.card{position:relative;width:100%;max-width:520px;border-radius:30px;padding:clamp(26px,3vw,42px);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(16px) scale(.985);filter:blur(8px);transition:opacity 1.3s .5s,transform 1.3s .5s,filter 1.3s .5s,visibility 0s 1.8s,border-color .4s,box-shadow .4s}
body.on .card{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;transition:opacity 1.3s .5s,transform 1.3s .5s,filter 1.3s .5s,visibility 0s,border-color .4s,box-shadow .4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 50% at 15% 0%,rgba(255,255,255,.13),transparent 60%);pointer-events:none}
.card:focus-within{border-color:rgba(var(--ice),.5)}
.card>form{position:relative}
.logo{display:block;margin-bottom:22px}
h1{font:600 30px/1.15 Inter,sans-serif;letter-spacing:-.025em;margin:0 0 6px}
.sub{margin:0 0 6px;color:var(--dim)}
.fld{margin-top:16px}
label.l{display:block;font-size:13.5px;font-weight:500;color:#D5E3F3;margin-bottom:7px}
.ctl{position:relative}
.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#8FA5C0;pointer-events:none}
input.t{width:100%;padding:13px 46px 13px 44px;border-radius:14px;color:var(--ink);font:inherit;background:rgba(6,12,24,.42);border:1px solid rgba(var(--ice),.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 5px 12px rgba(0,0,0,.18);transition:border-color .25s,box-shadow .25s}
input.t::placeholder{color:#8392A6}
input.t:focus{outline:none;border-color:rgba(var(--ice),.75);box-shadow:0 0 0 3px rgba(var(--ice),.18),inset 0 5px 12px rgba(0,0,0,.18)}
input.t[aria-invalid="true"]{border-color:var(--err)}
.err{margin:6px 2px 0;min-height:0;font-size:13px;color:var(--err)}
.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:11px;background:none;color:#9FB2CA;cursor:pointer;display:grid;place-items:center}
.eye:hover{color:#fff}.eye:focus-visible{outline:2px solid rgb(var(--ice))}
.eye .sl{display:none}.eye[aria-pressed="true"] .sl{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:14px}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative}
.chk input{position:absolute;opacity:0;width:20px;height:20px;margin:0}
.box{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;background:rgba(6,12,24,.4);border:1px solid rgba(var(--ice),.4);transition:background .25s}
.box svg{opacity:0;transform:scale(.6);transition:.2s}
.chk input:checked+.box{background:rgba(var(--ice),.4);border-color:rgba(var(--ice),.9)}.chk input:checked+.box svg{opacity:1;transform:none}
.chk input:focus-visible+.box{outline:2px solid rgb(var(--ice));outline-offset:2px}
a,.lk{color:rgb(var(--ice));text-underline-offset:3px;background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(var(--ice),.4)}
a:hover,.lk:hover{text-decoration-color:currentColor}
a:focus-visible,.lk:focus-visible{outline:2px solid rgb(var(--ice));outline-offset:3px;border-radius:4px}
.go{position:relative;overflow:hidden;width:100%;margin-top:22px;padding:14px;border-radius:14px;color:#fff;font:600 15.5px Inter,sans-serif;cursor:pointer;background:linear-gradient(180deg,rgba(var(--ice),.4),rgba(var(--ice),.17));border:1px solid rgba(var(--ice),.6);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 10px 24px rgba(0,0,0,.35);transition:transform .2s,background .3s,box-shadow .3s}
.go::before{content:"";position:absolute;inset:0 0 50%;background:linear-gradient(rgba(255,255,255,.2),transparent);pointer-events:none}
.go:hover{background:linear-gradient(180deg,rgba(var(--ice),.5),rgba(var(--ice),.22));transform:translateY(-1px)}
.go:active{transform:scale(.985)}.go:focus-visible{outline:2px solid #fff;outline-offset:3px}.go:disabled{opacity:.6;cursor:wait}
.or{display:flex;align-items:center;gap:14px;margin:20px 0 16px;color:var(--dim);font-size:12.5px;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(var(--ice),.2)}
.foot{margin:22px 0 0;text-align:center;color:var(--dim)}
.st{margin:14px 0 0;min-height:1.3em;text-align:center;font-size:13.5px;color:var(--dim)}.st.err{color:var(--err)}.st.ok{color:#B5E8C8}
@media (max-width:900px){
 :root{--lx:50%}
 .stage{grid-template-columns:1fr;align-items:start}
 .slats,.floor,.pool,.shaft{display:none}
 .lampw{position:relative;left:auto;top:auto;transform:none;margin:0 auto;width:clamp(190px,52vw,250px)}
 @keyframes drop{from{opacity:0;transform:translateY(-20px)}}
 .side{grid-column:1;padding:14px 16px 40px}
}
@media (prefers-reduced-motion:reduce){.mote{animation:none}*,*::before{transition-duration:.01ms!important}.gi{animation-duration:28s!important}}
</style>
</head>

  </section>
 </main>
</div>

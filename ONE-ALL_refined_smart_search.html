function phone(v){var d=String(v).replace(/[\s-]/g,'');return /^(0|\+?234)\d{10}$/.test(d)?d.replace(/^\+?234/,'0'):''}
// Each business profile has its own context-aware assistant. It uses that listing's details;
// connecting a real language model requires a secure backend and business-specific data access.
function businessAssistantAnswer(b,q){
var x=String(q||'').toLowerCase(),name=b.name||'this business',services=(b.services||[]).join(', '),hours=b.hours||'not provided',address=b.addr||b.city||'not provided';
if(/^(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(x))return 'Hello! I’m '+name+'’s virtual assistant. I can help with services, opening hours, location, booking questions, and how to contact the business.';
if(/service|offer|do you|what can|provide|available/.test(x))return services?' '+name+' offers: '+services+'. '+(b.desc||'Ask the owner if you need more details.'):'I don’t have a full service list for '+name+' yet. Please ask the business owner directly.';
if(/hour|open|close|time|today|weekend/.test(x))return 'The listed opening hours for '+name+' are: '+hours+'. Hours can change, so please confirm with the owner before travelling.';
if(/where|address|location|located|direction|map/.test(x))return 'The listed location for '+name+' is '+address+'. You can use the Open on map link on this profile. If you need exact directions, please confirm with the owner.';
if(/price|cost|how much|fee|charge|rate|₦|naira|cheap|expensive/.test(x))return 'I don’t have confirmed prices for '+name+' in this listing, and I don’t want to guess. Tap “Chat on WhatsApp” or “Call business” to ask for the current price.';
if(/book|booking|appointment|reserve|schedule|when can/.test(x))return 'I can help with general questions, but I can’t confirm bookings from this page. Please contact '+name+' on WhatsApp or by phone to check availability and arrange an appointment.';
if(/phone|number|call|whatsapp|contact|message|owner|talk|human/.test(x))return 'You can reach '+name+' using the Call business or Chat on WhatsApp buttons above. Those open your phone app or WhatsApp with the business contact details.';
if(/payment|pay|transfer|account|deposit/.test(x))return 'Please confirm payment methods and account details directly with '+name+' using the contact buttons. Never send money to an unverified account.';
if(/thank/.test(x))return 'You’re welcome! If you need a specific price or confirmation, the business owner can give you the most accurate answer.';
return 'I’m '+name+'’s listing assistant. I can answer from the details available here: services ('+(services||'not listed')+'), opening hours ('+hours+'), and location ('+address+'). I don’t have enough confirmed information to answer that accurately, so please contact the owner on WhatsApp or by phone. This demo assistant is not yet connected to a live AI model.';
}

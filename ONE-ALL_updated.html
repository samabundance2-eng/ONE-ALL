var SQL="create table categories(id text primary key,name text);\ncreate table businesses(id uuid primary key default gen_random_uuid(),owner_id uuid not null references auth.users,name text not null,contact_name text,phone text,whatsapp text,category text references categories,description text,services text[],address text,city text,state text,lat double precision,lng double precision,hours text,status text not null default 'pending' check(status in('pending','approved','rejected','suspended')),created_at timestamptz default now());\ncreate table payments(id uuid primary key default gen_random_uuid(),business_id uuid references businesses,provider text,reference text unique,amount_kobo int,status text default 'initiated',verified_at timestamptz);\ncreate table subscriptions(business_id uuid references businesses,payment_id uuid references payments,starts_at timestamptz,expires_at timestamptz);\ncreate table reviews(id uuid primary key default gen_random_uuid(),business_id uuid references businesses,user_id uuid references auth.users,stars int check(stars between 1 and 5),body text,verified boolean default false,hidden boolean default false,unique(business_id,user_id));\ncreate table reports(id uuid primary key default gen_random_uuid(),reporter_id uuid,business_id uuid,review_id uuid,reason text,resolved boolean default false);\ncreate table admins(user_id uuid primary key references auth.users);\nalter table businesses enable row level security; alter table payments enable row level security; alter table subscriptions enable row level security; alter table reviews enable row level security; alter table reports enable row level security;\n-- public sees only approved + currently paid\ncreate policy pub on businesses for select using(status='approved' and exists(select 1 from subscriptions s where s.business_id=id and s.expires_at>now()));\ncreate policy own_read on businesses for select using(owner_id=auth.uid());\ncreate policy own_add on businesses for insert with check(owner_id=auth.uid() and status='pending');\ncreate policy adm on businesses for all using(exists(select 1 from admins where user_id=auth.uid()));\n-- no owner UPDATE policy: status can only change through admin policy\n-- payments/subscriptions: NO user write policies. Only a server function that checks the Paystack webhook with the secret key writes them.\ncreate policy rev_add on reviews for insert with check(user_id=auth.uid() and verified=false);\n-- unique(business_id,user_id) blocks duplicate ratings\n-- nearby search: PostGIS ST_DWithin in an RPC, or the haversine used in this prototype";
